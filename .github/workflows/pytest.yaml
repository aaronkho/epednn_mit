name: pytest

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  pull_request_review:
    types: [submitted]

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        backend: ["jax", "pytorch", "tensorflow"]

    steps:
    - uses: actions/checkout@v4

    - name: setup-python-${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: install-dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[${{ matrix.backend }},dev]"

    - name: run-pytest
      run: |
        pytest tests/test_utils.py tests/test_sparc_${{ matrix.backend }}.py
